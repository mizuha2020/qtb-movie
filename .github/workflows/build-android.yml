name: Build Android APK

on:
  push:
    branches: [ main, master, tv ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web App (Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "Building with API URL: $VITE_API_URL"
          npm run build

      - name: Sync Android Platform & Assets
        run: |
          npx cap sync android
          node scripts/prepare-assets.cjs
          node scripts/slim-android-audio.cjs

      - name: Verify Gradle wrapper jar
        run: |
          cd android
          if ! unzip -tq gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "gradle-wrapper.jar is corrupt, downloading fresh copy..."
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
            unzip -tq gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTB-Cinema-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

